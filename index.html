<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0f11" />
    <meta name="description" content="王子轩 UX/UI/AI Design 作品集，2022-2026。" />
    <title>WANGZIXUAN PORTFOLIO | 2026</title>
    <style>
      :root {
        color-scheme: dark;
        background: #fff;
      }

      @font-face {
        font-family: "FZ Yuejin";
        src: url("assets/about-intro/fz-yuejin.ttf") format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: "FZ Yuejin Portfolio";
        src: url("assets/about-intro/fz-yuejin-portfolio.ttf") format("truetype");
        font-display: swap;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body { margin: 0; min-height: 100%; }

      html { scroll-behavior: auto; }

      body { background: #0f0f11; }

      main {
        position: relative;
        width: min(100%, 1440px);
        margin-inline: auto;
        aspect-ratio: 720 / 446;
        overflow: hidden;
      }

      .about {
        position: relative;
        width: min(100%, 1440px);
        margin-inline: auto;
        aspect-ratio: 1440 / 1625;
        overflow: hidden;
        background: #0f0f11;
        container-type: inline-size;
      }

      .about-dot-field {
        position: absolute;
        z-index: 2;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        pointer-events: none;
        transition: opacity 700ms ease;
      }

      .about.is-visible .about-dot-field { opacity: 0.5; }

      .about-intro {
        position: absolute;
        z-index: 4;
        top: calc(12.4% - 1.528cqw - 30px);
        left: calc(4.45% - 10px);
        display: flex;
        width: max-content;
        height: calc(3.056cqw + 20px);
        align-items: center;
        gap: 2.29cqw;
        padding: 10px;
        background: #0f0f11;
      }

      .about-intro-name {
        flex: 0 0 8.889cqw;
        margin: 0;
        overflow: visible;
        color: #fff;
        font-family: "FZ Yuejin", sans-serif;
        font-size: 3.056cqw;
        font-weight: 400;
        line-height: 1;
        white-space: nowrap;
      }

      .intro-char {
        display: inline-block;
        opacity: 0;
        transform: translateY(.55em);
      }

      .about-intro.is-active .intro-char {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 1250ms cubic-bezier(.18,.68,.24,1), transform 1250ms cubic-bezier(.18,.68,.24,1);
        transition-delay: var(--intro-delay, 0ms);
      }

      .about-intro-tags {
        display: flex;
        align-items: center;
        gap: 1.111cqw;
      }

      .about-intro-tag-frame {
        position: relative;
        display: block;
        flex: none;
        height: 3.056cqw;
        opacity: 0;
        clip-path: inset(0 0 100% 0);
        transition: clip-path 900ms cubic-bezier(.2,.7,.2,1), opacity 500ms ease;
      }

      .about-intro-tag-frame:nth-child(1) { width: 14.583cqw; }
      .about-intro-tag-frame:nth-child(2) { width: 10.833cqw; }
      .about-intro-tag-frame:nth-child(3) { width: 10.799cqw; }

      .about-intro-tag-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }

      .about-intro-tag-shine {
        position: absolute;
        z-index: 1;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .about-intro.is-active .about-intro-tag-frame {
        opacity: 1;
        clip-path: inset(0);
      }

      .about-intro.is-active .about-intro-tag-frame:nth-child(1) { transition-delay: 100ms; }
      .about-intro.is-active .about-intro-tag-frame:nth-child(2) { transition-delay: 220ms; }
      .about-intro.is-active .about-intro-tag-frame:nth-child(3) { transition-delay: 340ms; }

      .about.is-visible:not(.has-intro-complete) .about-story,
      .about.is-visible:not(.has-intro-complete) .about-profile { opacity: 0; }

      .about.is-visible.has-intro-complete .about-story,
      .about.is-visible.has-intro-complete .about-profile { opacity: 1; }

      .about-story,
      .about-profile { transition: none; }

      .about-story img,
      .about-profile img {
        opacity: 0;
        clip-path: inset(0 0 100% 0);
        transition: opacity 2s ease, clip-path 2s cubic-bezier(.2,.7,.2,1), filter 2s ease;
      }

      .about.is-visible.has-intro-complete .about-story img,
      .about.is-visible.has-intro-complete .about-profile img {
        opacity: 1;
        clip-path: inset(0);
        filter: blur(0);
      }

      @media (max-width: 760px) {
        .experience-gallery { inset: 75.5% 0 0; padding: 4.6% 4% 0; }
        .experience-track { gap: 1.8%; height: 82%; }
        .experience-card img { border-radius: 8px; }
        .experience-card.is-active { flex-grow: 3.2; }
        .experience-card:nth-child(n + 4).is-active img { flex-basis: 240px; height: 240px; }
        .experience-caption { flex-basis: 20px; margin-top: 8px; font-size: 13px; line-height: 20px; }
      }

      .about-layer {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 650ms ease;
        pointer-events: none;
      }

      .about-layer img {
        display: block;
        width: 100%;
        height: 100%;
        filter: blur(12px);
        transition: filter 800ms ease;
      }

      .about-title { visibility: hidden; }
      .about-story {
        clip-path: polygon(0 16.5%, 71% 16.5%, 71% 44%, 0 44%);
        transform: translateY(-20px);
      }
      .about-profile { clip-path: polygon(70.8% 6.1%, 100% 6.1%, 100% 48.2%, 70.8% 48.2%); }
      .about-achievements { clip-path: polygon(0 47.4%, 100% 47.4%, 100% 100%, 0 100%); }
      .about-top-mask {
        position: absolute;
        z-index: 2;
        inset: 0 0 auto;
        height: 6.2%;
        background: #0f0f11;
        pointer-events: none;
      }

      .about.is-visible .about-layer { opacity: 1; }
      .about.is-visible .about-layer img { filter: blur(0); }
      .about.is-visible .about-story { transition-delay: 300ms; }
      .about.is-visible .about-profile { transition-delay: 300ms; }
      .about.is-visible .about-achievements { opacity: 0; }
      .about.is-visible.has-achievements .about-achievements { opacity: 1; }

      .experience-gallery {
        position: absolute;
        z-index: 3;
        inset: 75.5% 0 0;
        padding: 3.3% 5.5% 0;
        background: #0f0f11;
        transform: translateY(-26px);
        opacity: 0;
        visibility: hidden;
        transition: opacity 650ms ease, visibility 0s linear 650ms;
      }

      .about.has-achievements .experience-gallery {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }

      .experience-track {
        display: flex;
        align-items: flex-start;
        gap: 2.4%;
        width: 100%;
        height: 90%;
      }

      .experience-card {
        position: relative;
        display: flex;
        flex-direction: column;
        flex: 1 1 0;
        min-width: 0;
        height: 100%;
        padding: 0;
        overflow: visible;
        border: 0;
        background: transparent;
        cursor: pointer;
        transition: flex-grow 700ms cubic-bezier(.2,.75,.2,1), opacity 500ms ease, box-shadow 500ms ease;
        opacity: 0.48;
      }

      .experience-card img {
        display: block;
        width: 100%;
        min-height: 0;
        flex: 1 1 auto;
        border-radius: 13px;
        background: #202023;
        object-fit: cover;
        filter: blur(2px) brightness(.65);
        transform: scale(1.02);
        transition: filter 650ms ease, transform 800ms cubic-bezier(.2,.75,.2,1);
      }

      .experience-card.is-active {
        flex-grow: 3.7;
        opacity: 1;
        box-shadow: none;
      }

      .experience-card.is-active img {
        filter: blur(0) brightness(1);
        transform: scale(1);
        box-shadow: 0 0 32px rgba(255,255,255,.24);
      }

      .experience-card:nth-child(n + 4) img { object-position: center 82%; }

      .experience-card:nth-child(n + 4).is-active { height: auto; }

      .experience-card:nth-child(n + 4).is-active img {
        flex: 0 0 320px;
        height: 320px;
        object-position: center 100%;
      }

      .experience-caption {
        flex: 0 0 30px;
        margin: 14px 0 0;
        overflow: hidden;
        color: rgba(255,255,255,.8);
        font-size: 18px;
        line-height: 30px;
        text-align: left;
        opacity: 0;
        visibility: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        transition: opacity 250ms ease, visibility 0s linear 250ms;
      }

      .experience-card.is-active .experience-caption {
        opacity: 1;
        visibility: visible;
        transition-delay: 0s;
      }

      .projects-page {
        position: relative;
        width: min(100%, 1440px);
        height: 900px;
        min-height: 900px;
        margin-inline: auto;
        overflow: hidden;
        background: #0f0f11;
        isolation: isolate;
      }

      .ai-workflow-page {
        position: relative;
        width: min(100%, 1440px);
        height: 1600px;
        min-height: 1600px;
        margin-inline: auto;
        overflow: hidden;
        background: #0f0f11;
        isolation: isolate;
      }

      .ai-workflow-grid-field {
        position: absolute;
        z-index: 0;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: .72;
      }

      .ai-workflow-content {
        position: relative;
        z-index: 1;
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: flex-start;
        padding: 138px 5.2% 70px;
      }

      .ai-workflow-title {
        display: block;
        width: 100%;
        height: auto;
        flex: none;
        filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .42));
      }

      .ai-workflow-title-frame {
        display: block;
        width: min(465px, 100%);
        flex: none;
      }

      .workflow-gallery {
        position: relative;
        display: flex;
        width: 100%;
        height: 280px;
        flex: none;
        align-items: stretch;
        gap: 14px;
        margin-top: 48px;
        overflow: hidden;
        background: transparent;
        isolation: isolate;
      }

      .workflow-gallery-item {
        position: relative;
        display: block;
        height: 100%;
        flex: 0 0 78px;
        min-width: 0;
        padding: 0;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 18px 46px rgba(0,0,0,.45);
        color: white;
        cursor: pointer;
        isolation: isolate;
        transition: flex-grow 650ms cubic-bezier(.2,.75,.2,1), border-color 350ms ease, box-shadow 350ms ease;
      }

      .workflow-gallery-item::after {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.74));
        content: "";
        opacity: .68;
        transition: opacity 350ms ease;
        pointer-events: none;
      }

      .workflow-gallery-media {
        position: absolute;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        background: #fff;
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
        overscroll-behavior: contain;
        touch-action: pan-x pan-y;
      }

      .workflow-gallery-media.can-scroll-x { overflow-x: auto; overflow-y: hidden; }
      .workflow-gallery-media.can-scroll-y { overflow-x: hidden; overflow-y: auto; }
      .workflow-gallery-item:not(.is-active) .workflow-gallery-media { overflow: hidden; }
      .workflow-gallery-media::-webkit-scrollbar { width: 9px; height: 9px; }
      .workflow-gallery-media::-webkit-scrollbar-track { background: transparent; }
      .workflow-gallery-media::-webkit-scrollbar-thumb {
        border: 2px solid transparent;
        border-radius: 8px;
        background: transparent;
        background-clip: padding-box;
      }
      .workflow-gallery-media.is-scrollbar-visible { scrollbar-color: rgba(42,47,54,.75) rgba(42,47,54,.14); }
      .workflow-gallery-media.is-scrollbar-visible::-webkit-scrollbar-track { background: #fff; }
      .workflow-gallery-media.is-scrollbar-visible::-webkit-scrollbar-thumb { background: rgba(42,47,54,.72); background-clip: padding-box; }

      .workflow-gallery-item img {
        display: block;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: cover;
        object-position: center;
        transition: filter 450ms ease;
        filter: grayscale(.62) brightness(.56) blur(2px);
      }

      .workflow-gallery-item[data-fixed-media="true"] .workflow-gallery-media {
        overflow-anchor: none;
      }

      .workflow-gallery-item[data-fixed-media="true"] .workflow-gallery-media img {
        object-position: left top;
      }

      .workflow-gallery-title {
        position: absolute;
        z-index: 2;
        right: 22px;
        bottom: 20px;
        left: 22px;
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.35;
        text-align: left;
        text-shadow: 0 2px 14px rgba(0,0,0,.8);
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transform: translateY(8px);
        transition: opacity 300ms ease, transform 350ms ease, visibility 0s linear 300ms;
      }

      .workflow-gallery-item.is-active,
      .workflow-gallery-item:hover,
      .workflow-gallery-item:focus-visible {
        z-index: 2;
        flex-grow: 1;
        border-color: rgba(255,255,255,.58);
        box-shadow: 0 22px 58px rgba(0,0,0,.58), 0 0 26px rgba(255,255,255,.12);
        outline: none;
      }

      .workflow-gallery-item.is-active img,
      .workflow-gallery-item:hover img,
      .workflow-gallery-item:focus-visible img { filter: none; object-fit: cover; }

      .workflow-gallery-item.is-active::after,
      .workflow-gallery-item:hover::after,
      .workflow-gallery-item:focus-visible::after { opacity: .34; }

      .workflow-gallery-item.is-active .workflow-gallery-title,
      .workflow-gallery-item:hover .workflow-gallery-title,
      .workflow-gallery-item:focus-visible .workflow-gallery-title {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        transition-delay: 0s;
      }

      .geo-logo-loop {
        position: relative;
        width: 100%;
        height: 174px;
        flex: none;
        margin-top: 30px;
        overflow: hidden;
      }

      .geo-logo-loop-track {
        display: flex;
        width: max-content;
        height: 100%;
        animation: geo-logo-scroll var(--geo-loop-duration, 40s) linear infinite;
        will-change: transform;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent);
        mask-image: linear-gradient(to right, transparent, #000 5%, #000 95%, transparent);
      }

      .geo-logo-loop:hover .geo-logo-loop-track,
      .geo-logo-loop:focus-within .geo-logo-loop-track { animation-play-state: paused; }

      .geo-logo-list {
        display: flex;
        height: 100%;
        align-items: center;
        gap: 0;
        flex: none;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .geo-logo-item {
        position: relative;
        display: flex;
        width: var(--geo-logo-item-width, 160px);
        height: 160px;
        flex: 0 0 var(--geo-logo-item-width, 160px);
        align-items: center;
        flex-direction: column;
        justify-content: flex-start;
        padding-top: 8px;
        opacity: .88;
        transform: scale(1);
        transform-origin: center 68px;
        transition: opacity 260ms ease, transform 320ms cubic-bezier(.2,.75,.2,1);
      }

      .geo-logo-loop:hover .geo-logo-item,
      .geo-logo-loop:focus-within .geo-logo-item { opacity: .28; transform: scale(.76); }

      .geo-logo-loop .geo-logo-item:hover,
      .geo-logo-loop .geo-logo-item:focus-visible {
        z-index: 2;
        opacity: 1;
        transform: scale(1.24);
        outline: none;
      }

      .geo-logo-item img {
        display: block;
        width: min(120px, calc(var(--geo-logo-item-width, 160px) * .76));
        height: min(120px, calc(var(--geo-logo-item-width, 160px) * .76));
        flex: none;
        object-fit: contain;
        filter: drop-shadow(0 5px 12px rgba(0,0,0,.28));
        pointer-events: none;
      }

      .geo-logo-tooltip {
        position: absolute;
        z-index: 4;
        display: block;
        width: max-content;
        max-width: calc(100% - 24px);
        bottom: 2px;
        left: 50%;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
        white-space: nowrap;
        text-align: center;
        text-shadow: 0 2px 10px rgba(0,0,0,.75);
        opacity: 0;
        transform: translate(-50%, 5px);
        transition: opacity 220ms ease, transform 260ms ease;
        pointer-events: none;
      }

      .geo-logo-tooltip.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .research-workflow-tag {
        display: block;
        width: min(310px, 70vw);
        height: auto;
        flex: none;
        margin-top: 44px;
        filter: drop-shadow(0 8px 14px rgba(0,0,0,.38));
      }

      .research-workflow-gallery {
        height: 460px;
        margin-top: 40px;
      }

      .research-workflow-gallery .workflow-gallery-item {
        flex-basis: 11.2%;
      }

      .research-workflow-gallery video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
        filter: grayscale(.62) brightness(.56) blur(2px);
        transition: filter 450ms ease;
      }

      .research-workflow-gallery .workflow-gallery-item.is-active video,
      .research-workflow-gallery .workflow-gallery-item:hover video,
      .research-workflow-gallery .workflow-gallery-item:focus-visible video { filter: none; }

      @keyframes geo-logo-scroll { to { transform: translateX(-50%); } }

      .project-detail-drawer {
        position: fixed;
        z-index: 1000;
        top: 100px;
        right: 0;
        bottom: auto;
        left: 0;
        height: calc(100vh - 100px);
        height: calc(100dvh - 100px);
        display: block;
        overflow: hidden;
        pointer-events: none;
      }

      .project-detail-backdrop {
        position: absolute;
        inset: 0;
        background: transparent;
        opacity: 1;
      }

      .project-detail-panel {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 22px 22px 0 0;
        background: #f8f9fc;
        box-shadow: 0 -20px 70px rgba(0, 0, 0, .28);
        transform: translate3d(0, 100%, 0);
        will-change: transform;
        transition: transform 420ms cubic-bezier(.22, .68, 0, 1);
      }

      .project-detail-drawer.is-open {
        pointer-events: auto;
      }

      .project-detail-drawer.is-closing { pointer-events: auto; }
      .project-detail-drawer.is-open .project-detail-panel {
        transform: translate3d(0, 0, 0);
      }

      .project-detail-toolbar {
        position: absolute;
        z-index: 1;
        top: 18px;
        right: max(24px, calc((100vw - 1392px) / 2));
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: none;
      }

      .project-detail-close {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid rgba(25, 25, 25, .13);
        border-radius: 50%;
        background: rgba(255,255,255,.92);
        color: #191919;
        font: 28px/1 sans-serif;
        cursor: pointer;
        pointer-events: auto;
        box-shadow: 0 4px 16px rgba(0,0,0,.12);
      }

      .project-detail-sidebar {
        position: absolute;
        z-index: 2;
        top: 78px;
        right: max(24px, calc((100vw - 1392px) / 2));
        width: 42px;
        max-height: calc(100% - 96px);
        color: #28282b;
        pointer-events: auto;
      }

      .project-detail-sidebar-list {
        display: flex;
        flex-direction: column;
        gap: 11px;
        max-height: inherit;
        margin: 0;
        padding: 8px 0;
        overflow: visible;
        list-style: none;
      }

      .project-detail-sidebar-item { position: relative; height: 13px; }

      .project-detail-sidebar-button {
        position: absolute;
        top: 50%;
        right: 0;
        display: flex;
        width: max-content;
        min-height: 13px;
        align-items: center;
        gap: 10px;
        padding: 0;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .project-detail-sidebar-marker {
        display: block;
        width: calc(34px + var(--effect, 0) * 22px);
        height: 2px;
        flex: 0 0 auto;
        transform: translateX(calc(var(--effect, 0) * -10px)) scaleY(calc(1 + var(--effect, 0) * 1.5));
        transform-origin: right center;
        background: rgba(48, 48, 52, calc(.36 + var(--effect, 0) * .48));
        transition: width 80ms linear, height 80ms linear, background-color 80ms linear;
      }

      .project-detail-sidebar-bubble {
        position: absolute;
        top: 0;
        right: 38px;
        left: auto;
        display: block;
        width: max-content;
        max-width: min(500px, calc(100vw - 110px));
        overflow: visible;
        padding: 7px 12px;
        border: 1px solid rgba(255, 255, 255, .58);
        border-radius: 7px;
        background: rgba(255, 255, 255, .68);
        -webkit-backdrop-filter: blur(12px) saturate(1.15);
        backdrop-filter: blur(12px) saturate(1.15);
        box-shadow: 0 5px 18px rgba(20, 20, 25, .14);
        color: #252529;
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
        opacity: 0;
        transform: translate(-5px, -50%);
        transition: opacity 110ms ease, transform 140ms ease;
        white-space: nowrap;
        pointer-events: none;
      }

      .project-detail-sidebar-bubble::before {
        position: absolute;
        top: 50%;
        right: -6px;
        width: 10px;
        height: 10px;
        border-right: 1px solid rgba(255, 255, 255, .58);
        border-bottom: 1px solid rgba(255, 255, 255, .58);
        border-radius: 0 0 2px 0;
        background: rgba(255, 255, 255, .76);
        transform: translateY(-50%) rotate(-45deg);
        content: "";
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }

      .project-detail-sidebar-bubble.is-visible {
        opacity: 1;
        transform: translate(0, -50%);
      }

    <script>
      (() => {
        const aboutSection = document.querySelector('.about');
        const aboutLink = document.querySelector('.site-nav a[href="#about"]');
        const projectsSection = document.querySelector('.projects-page');
        const projectDetailDrawer = document.querySelector('.project-detail-drawer');
        const projectDetailImage = document.querySelector('.project-detail-image');
        const projectDetailScroll = document.querySelector('.project-detail-scroll');
        const projectSidebar = document.querySelector('.project-detail-sidebar');
        const projectSidebarList = document.querySelector('.project-detail-sidebar-list');
        const projectSidebarBubble = document.querySelector('.project-detail-sidebar-bubble');
        const projectsGridCanvas = [...document.querySelectorAll('.projects-grid-field, .ai-workflow-grid-field')];
        const aiWorkflowSection = document.querySelector('.ai-workflow-page');
        const gridSections = [projectsSection, aiWorkflowSection];
        const aiWorkflowLink = document.querySelector('.site-nav a[href="#ai-workflow"]');
        const workflowGallery = document.querySelector('.workflow-gallery:not(.research-workflow-gallery)');
        const workflowGalleryItems = [...workflowGallery.querySelectorAll('.workflow-gallery-item')];
        const projectsGridContexts = projectsGridCanvas.map(canvas => canvas.getContext('2d', { alpha: true }));
        const projectsGrid = {
          width: 1, height: 1, ratio: 1, offsetX: 0, offsetY: 0, time: 0, last: 0,
          startedAt: 0, started: false, visible: false, visibleSections: new Set(), frame: 0, pointer: null,
          spot: { x: 0, y: 0, vx: 0, vy: 0, power: 0 }, lit: new Map(), cascades: []
        };
        const projectsLink = document.querySelector('.site-nav a[href="#projects"]');
        const dotCanvas = document.querySelector('.about-dot-field');
        const dotContext = dotCanvas.getContext('2d', { alpha: true });
        const referenceImage = document.querySelector('.about-title img');
        const intro = document.querySelector('.about-intro');
        const introChars = [...intro.querySelectorAll('.intro-char')];
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let introTimer = 0;
        const dotReference = document.createElement('canvas');
        const dotReferenceContext = dotReference.getContext('2d', { willReadFrequently: true });
        const dotVisibleHeight = 0.474;
        const dotSize = 5;
        const dotGap = 18;
        const dotCell = dotSize + dotGap;
        let dotPixels = null;
        let dotFrame = 0;
        let dotLastFrame = 0;
        let dotReady = false;
        let dotGrid = { width: 0, height: 0, cols: 0, rows: 0, count: 0, centerX: 0, centerY: 0, reach: 1 };
        let dotRest = new Float32Array(0);
        let dotOffset = new Float32Array(0);
        let dotVelocity = new Float32Array(0);
        let dotNextVelocity = new Float32Array(0);
        let dotNextOffset = new Float32Array(0);
        let dotWave = new Float32Array(0);
        let dotAllowed = new Uint8Array(0);
        const dotPointer = { x: 0, y: 0, vx: 0, vy: 0, time: 0, inside: false, presence: 0 };
        const dotShocks = [];
        let dotIntroStart = 0;

        introChars.forEach((character, index) => {
          character.style.setProperty('--intro-delay', `${index * 50}ms`);
        });

        function startAboutIntro() {
          window.clearTimeout(introTimer);
          aboutSection.classList.remove('has-intro-complete');
          aboutSection.classList.remove('has-achievements');
          intro.classList.remove('is-active');
          requestAnimationFrame(() => intro.classList.add('is-active'));
          introTimer = window.setTimeout(() => {
            if (aboutSection.classList.contains('is-visible')) {
              aboutSection.classList.add('has-intro-complete');
              aboutSection.classList.add('has-achievements');
            }
          }, reducedMotion ? 0 : 1350);
        }

        function resetAboutIntro() {
          window.clearTimeout(introTimer);
          introTimer = 0;
          aboutSection.classList.remove('has-intro-complete');
          aboutSection.classList.remove('has-achievements');
          intro.classList.remove('is-active');
        }

        function resizeDotField() {
          const rect = aboutSection.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
          dotCanvas.width = Math.round(rect.width * dpr);
          dotCanvas.height = Math.round(rect.height * dpr);
          dotContext.setTransform(dpr, 0, 0, dpr, 0, 0);
          dotReference.width = Math.round(rect.width);
          dotReference.height = Math.round(rect.height);
          if (referenceImage.complete && referenceImage.naturalWidth) {
            dotReferenceContext.drawImage(referenceImage, 0, 0, rect.width, rect.height);
            dotPixels = dotReferenceContext.getImageData(0, 0, dotReference.width, dotReference.height).data;
            dotReady = true;
            rebuildDotGrid();
          }
          if (aboutSection.classList.contains('is-visible')) {
            startDotField();
          }
        }

        function isClearDotBackground(x, y) {
          if (!dotPixels || !dotReference.width || !dotReference.height) return false;
          if (x < aboutSection.clientWidth * 0.62 &&
              y > aboutSection.clientHeight * 0.085 &&
              y < aboutSection.clientHeight * 0.165) return true;
          const clearance = 9;
          for (let oy = -clearance; oy <= clearance; oy += 3) {
            for (let ox = -clearance; ox <= clearance; ox += 3) {
              if (ox * ox + oy * oy > clearance * clearance) continue;
              const px = Math.max(0, Math.min(dotReference.width - 1, Math.round(x + ox)));
              const py = Math.max(0, Math.min(dotReference.height - 1, Math.round(y + oy)));
              const i = (py * dotReference.width + px) * 4;
              if (dotPixels[i] > 24 || dotPixels[i + 1] > 24 || dotPixels[i + 2] > 26) return false;
            }
          }
          return true;
        }

        function rebuildDotGrid() {
          const width = aboutSection.clientWidth;
          const height = aboutSection.clientHeight * dotVisibleHeight;
          const cols = Math.max(1, Math.floor((width + dotGap) / dotCell));
          const rows = Math.max(1, Math.floor((height + dotGap) / dotCell));
          const startX = (width - (cols * dotCell - dotGap)) / 2 + dotSize / 2;
          const startY = (height - (rows * dotCell - dotGap)) / 2 + dotSize / 2;
          const count = cols * rows;
          dotGrid = {
            width,
            height,
            cols,
            rows,
            count,
            centerX: width / 2,
            centerY: height / 2,
            reach: Math.hypot(width, height) / 2
          };
          dotRest = new Float32Array(count * 2);
          dotOffset = new Float32Array(count * 2);
          dotVelocity = new Float32Array(count * 2);
          dotNextVelocity = new Float32Array(count * 2);
          dotNextOffset = new Float32Array(count * 2);
          dotWave = new Float32Array(count * 4);
          dotAllowed = new Uint8Array(count);
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const node = row * cols + col;
              const index = node * 2;
              const x = startX + col * dotCell;
              const y = startY + row * dotCell;
              dotRest[index] = x;
              dotRest[index + 1] = y;
              dotAllowed[node] = isClearDotBackground(x, y) ? 1 : 0;
            }
          }
          dotIntroStart = 0;
        }

        function smoothDotStep(value) {
          const t = Math.max(0, Math.min(1, value));
          return t * t * t * (t * (t * 6 - 15) + 10);
        }

        function dotMotionActive(now) {
          if (dotShocks.length || (dotIntroStart && now - dotIntroStart < 1600)) return true;
          if (Math.abs(dotPointer.vx) + Math.abs(dotPointer.vy) > 1) return true;
          const targetPresence = dotPointer.inside ? 1 : 0;
          if (Math.abs(targetPresence - dotPointer.presence) > .002) return true;
          for (let i = 0; i < dotOffset.length; i++) {
            if (Math.abs(dotOffset[i]) > .02 || Math.abs(dotVelocity[i]) > .5) return true;
          }
          return false;
        }

        function wakeDotField() {
          if (!dotReady || dotFrame || !aboutSection.classList.contains('is-visible')) return;
          dotLastFrame = performance.now();
          dotFrame = requestAnimationFrame(animateDots);
        }

        function stepDotGrid(dt, now) {
          if (reducedMotion || !dotGrid.count) return;
          const zeta = 1 - .85 * .6;
          const omega = 4 / (zeta * .8);
          const stiffness = omega * omega;
          const damping = 2 * zeta * omega;
          const coupling = (.4 * 900) ** 2 / (dotCell * dotCell);
          const viscosity = Math.sqrt(coupling) * .06;
          const steps = Math.min(4, Math.max(1, Math.ceil(dt / (1 / 120))));
          const h = dt / steps;
          const pointerSpeed = Math.hypot(dotPointer.vx, dotPointer.vy);
          const drive = dotPointer.inside
            ? 6500 * Math.tanh(pointerSpeed / 900)
            : 0;
          const dirX = pointerSpeed > .001 ? dotPointer.vx / pointerSpeed : 0;
          const dirY = pointerSpeed > .001 ? dotPointer.vy / pointerSpeed : 0;
          const activeShocks = dotShocks.map(shock => {
            const front = ((now - shock.start) / 1000) * 650;
            const power = smoothDotStep(1 - front / 320);
            return { ...shock, front, amplitude: power * 5 * dotCell * .24 };
          });
          const presenceTarget = dotPointer.inside ? 1 : 0;
          dotPointer.presence += (presenceTarget - dotPointer.presence) * (1 - Math.exp(-dt / .2));
          dotWave.fill(0);

          for (let node = 0; node < dotGrid.count; node++) {
            const index = node * 2;
            const waveIndex = node * 4;
            const x = dotRest[index];
            const y = dotRest[index + 1];
            for (const shock of activeShocks) {
              if (shock.amplitude <= 0) continue;
              const px = x - shock.x;
              const py = y - shock.y;
              const distance = Math.hypot(px, py);
              if (distance < .001) continue;
              const u = (distance - shock.front) / (dotCell * 1.4);
              if (Math.abs(u) >= 3) continue;
              const nx = px / distance;
              const ny = py / distance;
              const profile = Math.exp(-u * u);
              const push = shock.amplitude * profile;
              const rate = (shock.amplitude * 2 * u * profile / (dotCell * 1.4)) * 650;
              dotWave[waveIndex] += nx * push;
              dotWave[waveIndex + 1] += ny * push;
              dotWave[waveIndex + 2] += nx * rate;
              dotWave[waveIndex + 3] += ny * rate;
            }

              const oy = dotOffset[index + 1];

              const vy = dotVelocity[index + 1];
              let ax = -stiffness * ox - damping * vx;
              let ay = -stiffness * oy - damping * vy;

              if (coupling > 0) {
                let lapX = -4 * ox;
                let lapY = -4 * oy;
                let lapVx = -4 * vx;
                let lapVy = -4 * vy;
                if (col > 0) {
                  lapX += dotOffset[index - 2]; lapY += dotOffset[index - 1];
                  lapVx += dotVelocity[index - 2]; lapVy += dotVelocity[index - 1];
                }
                if (col < dotGrid.cols - 1) {

                  lapVx += dotVelocity[index + dotGrid.cols * 2]; lapVy += dotVelocity[index + dotGrid.cols * 2 + 1];
                }
                ax += coupling * lapX + viscosity * lapVx;
                ay += coupling * lapY + viscosity * lapVy;

                const py = dotRest[index + 1] + oy - dotPointer.y;

          navContext.fill();
          navContext.restore();
          for (const element of document.querySelectorAll('.brand > span:last-child, .site-nav li a')) {
            const style = getComputedStyle(element);
            const rect = toCanvasRect(element);
            const fontScale = scaleY * rect.width / Math.max(1, element.offsetWidth * scaleX);
            navContext.font = `${style.fontWeight} ${parseFloat(style.fontSize) * fontScale}px ${style.fontFamily}`;
            navContext.textBaseline = 'middle';
            navContext.fillStyle = style.color;
            navContext.shadowColor = element.matches(':hover') ? 'rgba(255,255,255,.9)' : 'transparent';
            navContext.shadowBlur = element.matches(':hover') ? 16 * scaleX : 0;
            navContext.fillText(element.textContent.trim(), rect.x, rect.y + rect.height / 2);
          }
          navContext.shadowBlur = 0;
        }

        function updateBrandLens() {
          brandLensTimer = 0;
          if (!brandLensHover || !brandMark.classList.contains('is-playing') || !ready) return;
          draw();
          if (brandLensHover && brandMark.classList.contains('is-playing')) {
            brandLensTimer = window.setTimeout(updateBrandLens, 50);
          }
        }
        document.querySelector('.site-nav').addEventListener('pointerover', () => {
          if (ready) {
            draw();
            window.setTimeout(() => { if (ready) draw(); }, 230);
          }
        });
        document.querySelector('.site-nav').addEventListener('pointerout', () => {
          if (ready) {
            draw();
            window.setTimeout(() => { if (ready) draw(); }, 230);
          }
        });

        function drawRefraction() {
          if (!pixelSamplingAvailable || !sourcePixels) return false;
          const pixels = refractedPixels.data;
          const scale = R * 2 / lensSize;
          const half = lensSize / 2;

          for (let y = 0; y < lensSize; y++) {
            const dy = (y + 0.5 - half) * scale;
            for (let x = 0; x < lensSize; x++) {
              const dx = (x + 0.5 - half) * scale;
              const distance = Math.hypot(dx, dy);
              const index = (y * lensSize + x) * 4;
              if (distance >= R) {
                pixels[index + 3] = 0;
                continue;
              }

              const ratio = distance / R;
              const edge = Math.max(0, (ratio - 0.63) / 0.37);
              const bend = edge * edge * (3 - 2 * edge);
              const angle = Math.atan2(dy, dx);
              const wave = Math.sin(angle * 9 + ratio * 15) * bend * bend * 2.5;
              const sourceRadius = distance * (0.87 - 0.055 * bend) + wave;
              const directionX = distance ? dx / distance : 0;
              const directionY = distance ? dy / distance : 0;
              const sourceX = currentX + directionX * sourceRadius;
              const sourceY = currentY + directionY * sourceRadius;
              const dispersion = 0.55 + 4.2 * bend * bend;
              const highlight = 0.035 + 0.06 * (1 - ratio) * (1 - ratio);

              pixels[index] = sample(sourceX + directionX * dispersion, sourceY + directionY * dispersion, 0) * (1 - highlight) + 255 * highlight;
              pixels[index + 1] = sample(sourceX, sourceY, 1) * (1 - highlight) + 255 * highlight;
              pixels[index + 2] = sample(sourceX - directionX * dispersion, sourceY - directionY * dispersion, 2) * (1 - highlight) + 255 * highlight;
              pixels[index + 3] = Math.min(255, (R - distance) * 180);
            }
          }
          refractedContext.putImageData(refractedPixels, 0, 0);
          return true;
        }

        function draw() {
          ctx.clearRect(0, 0, W, H);
          renderNavForLens();
          if (drawRefraction()) {
            ctx.drawImage(refracted, currentX - R, currentY - R, R * 2, R * 2);
          } else {
            ctx.save();
            ctx.beginPath();
            ctx.arc(currentX, currentY, R - 2, 0, Math.PI * 2);
            ctx.clip();
            const magnification = 1.17;
            ctx.translate(currentX * (1 - magnification), currentY * (1 - magnification));
            ctx.scale(magnification, magnification);
            ctx.drawImage(backgroundCanvas, 0, 0, W, H);
            ctx.restore();

          }

          // Keep the fixed navigation legible inside the glass while the cover beneath refracts.
          ctx.save();
          ctx.beginPath();
          ctx.arc(currentX, currentY, R - 4, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(navSource, 0, 0, W, H);
          ctx.restore();

          ctx.save();
          ctx.beginPath();
          ctx.arc(currentX, currentY, R - 2, 0, Math.PI * 2);
          ctx.clip();
          const sheen = ctx.createLinearGradient(currentX - R, currentY - R, currentX + R, currentY + R);
          sheen.addColorStop(0, 'rgba(255,255,255,0.07)');
          sheen.addColorStop(0.5, 'rgba(255,255,255,0.015)');
          sheen.addColorStop(1, 'rgba(0,0,0,0.035)');
          ctx.fillStyle = sheen;
          ctx.fillRect(currentX - R, currentY - R, R * 2, R * 2);
          ctx.restore();

          ctx.save();
          ctx.beginPath();
          ctx.arc(currentX, currentY, R - 2, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0,0,0,0.8)';
          ctx.lineWidth = 5;
          ctx.shadowColor = 'rgba(0,0,0,0.5)';
          ctx.shadowBlur = 18;
          ctx.shadowOffsetY = 7;
          ctx.stroke();
          ctx.restore();

          const rim = ctx.createLinearGradient(currentX - R, currentY - R, currentX + R, currentY + R);
          rim.addColorStop(0, 'rgba(255,255,255,0.82)');
          rim.addColorStop(0.38, 'rgba(255,255,255,0.37)');
          rim.addColorStop(0.68, 'rgba(255,255,255,0.06)');
          rim.addColorStop(1, 'rgba(0,0,0,0.88)');
          ctx.beginPath();
          ctx.arc(currentX, currentY, R - 2, 0, Math.PI * 2);
          ctx.strokeStyle = rim;
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.drawImage(foreground, 0, 0, W, H);
        }

        function animate() {
          frame = 0;
          if (!visible || !ready) return;
          currentX += (targetX - currentX) * 0.22;
          currentY += (targetY - currentY) * 0.22;
          if (Math.abs(targetX - currentX) < 0.15) currentX = targetX;
          if (Math.abs(targetY - currentY) < 0.15) currentY = targetY;
          draw();
          const coverRect = cover.getBoundingClientRect();
          const brandRect = document.querySelector('.brand').getBoundingClientRect();
          const lensX = coverRect.left + currentX * coverRect.width / W;
          const lensY = coverRect.top + currentY * coverRect.height / H;
          const radius = R * coverRect.width / W;
          const nearestX = Math.max(brandRect.left, Math.min(lensX, brandRect.right));
          const nearestY = Math.max(brandRect.top, Math.min(lensY, brandRect.bottom));
          brandLensHover = coverRect.bottom > 0 && coverRect.top < window.innerHeight &&
            Math.hypot(lensX - nearestX, lensY - nearestY) < radius;
          syncBrandAnimation();
          if (brandLensHover && !brandLensTimer && brandMark.classList.contains('is-playing')) {
            brandLensTimer = window.setTimeout(updateBrandLens, 50);
          }
          if (currentX !== targetX || currentY !== targetY) frame = requestAnimationFrame(animate);
        }

        function resetLens() {
          if (!hoverQuery.matches || !ready) return;
          targetX = defaultX;
          targetY = defaultY;
          setMotionMode('idle');
          if (!frame) frame = requestAnimationFrame(animate);
        }

        window.addEventListener('pointermove', (event) => {
          if (!hoverQuery.matches || event.pointerType !== 'mouse' || !ready) return;
          const rect = cover.getBoundingClientRect();
          if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) {
            resetLens();
            return;
          }
          const x = (event.clientX - rect.left) * W / rect.width;
          const y = (event.clientY - rect.top) * H / rect.height;
          targetX = Math.min(W - R, Math.max(R, x));
          targetY = Math.min(H - R, Math.max(R, y));
          setMotionMode(x < 720 ? 'drawing' : 'looking');
          if (!visible) {
            currentX = targetX;
            currentY = targetY;
            visible = true;
            canvas.classList.add('is-visible');
          }
          if (!frame) frame = requestAnimationFrame(animate);
        });

        window.addEventListener('blur', resetLens);

        Promise.all([image.decode(), person.decode()]).then(() => {
          rebuildForeground();
          resize();
          if (ready) {
            visible = true;
            draw();
            canvas.classList.add('is-visible');
            loadMotion();
          }
        }).catch(() => {});
        new ResizeObserver(resize).observe(cover);
      })();
    </script>
  </body>
</html>
